name: AI Video Maker V3

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Nhập chủ đề video"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Story
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
        run: python script.py

      - name: Render Video
        run: python render.py

      - name: Create MP4
        run: |
          ffmpeg -y \
            -framerate 0.4 \
            -i frame%d.png \
            -i voice.mp3 \
            -c:v libx264 \
            -c:a aac \
            -pix_fmt yuv420p \
            -shortest output.mp4

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: AI Video ${{ github.run_number }}
          files: output.mp4
