
name: Video Bot

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Ý tưởng video"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Story
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
        run: python script.py

      - name: Render
        run: python render.py

      - name: Make Video
        run: |
          ffmpeg -y \
            -framerate 0.4 \
            -i frame%d.png \
            -i voice.mp3 \
            -c:v libx264 \
            -c:a aac \
            -pix_fmt yuv420p \
            -shortest output.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
