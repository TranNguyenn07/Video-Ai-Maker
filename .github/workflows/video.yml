name: AI Video Maker

on:
  workflow_dispatch:

  schedule:
    # 02:00 UTC
    - cron: "0 2 * * *"

    # 14:00 UTC
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: ai-video-maker
  cancel-in-progress: false

jobs:

  build:
    name: Build AI Video
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ======================================================
      # 3. FFMPEG
      # ======================================================

      - name: Install FFmpeg
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "ffprobe:"
          ffprobe -version | head -n 1

      # ======================================================
      # 4. PYTHON DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 5. PREFLIGHT
      # ======================================================

      - name: Preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING PREFLIGHT"
          echo "=========================================="

          python preflight.py

      # ======================================================
      # 6. CACHE
      # ======================================================

      - name: Restore render cache
        uses: actions/cache@v4
        with:
          path: |
            cache/images
            cache/tts
          key: |
            ai-video-cache-${{ runner.os }}-${{ hashFiles('assets/characters/characters.json', 'assets/characters/miu.png', 'assets/characters/bong.png') }}-${{ hashFiles('assets/story.json') }}
          restore-keys: |
            ai-video-cache-${{ runner.os }}-

      # ======================================================
      # 7. RENDER
      # ======================================================

      - name: Render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "START RENDER"
          echo "=========================================="

          python render.py

      # ======================================================
      # 8. FINAL FILE CHECK
      # ======================================================

      - name: Validate output
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING OUTPUT"
          echo "=========================================="

          test -f output/video.mp4
          test -s output/video.mp4

          echo ""
          echo "Video:"
          ls -lh output/video.mp4

          echo ""
          echo "FFprobe:"
          ffprobe \
            -v error \
            -show_entries \
            format=duration \
            -show_entries \
            stream=codec_type \
            -of json \
            output/video.mp4

      # ======================================================
      # 9. UPLOAD
      # ======================================================

      - name: Upload final video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-${{ github.run_number }}
          path: |
            output/video.mp4
            output/scenes/*.png
            output/audio/*.wav
          if-no-files-found: error
          retention-days: 7

      # ======================================================
      # 10. FAILURE DEBUG
      # ======================================================

      - name: Upload debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-debug-${{ github.run_number }}
          path: |
            output/
            cache/
            assets/story.json
          if-no-files-found: ignore
          retention-days: 3
