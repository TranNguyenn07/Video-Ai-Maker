name: Video Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow

      - run: python render.py

      - run: |
          ffmpeg -framerate 1 \
          -i frame%d.png \
          -c:v libx264 \
          -pix_fmt yuv420p \
          output.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
