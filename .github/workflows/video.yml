name: Video Bot

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Ý tưởng video"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Create prompt
        run: echo "${{ github.event.inputs.prompt }}" > prompt.txt

      - name: Render
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python render.py

      - name: Make video
        run: |
          ffmpeg -y -framerate 0.1 -i frame%d.png \
          -t 60 -pix_fmt yuv420p output.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
