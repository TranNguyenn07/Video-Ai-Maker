name: Video Bot

on:
  repository_dispatch:
    types: [create_video]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          echo "${{ github.event.client_payload.prompt }}" > prompt.txt
          python render.py

      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: prompt.txt
