name: AI Video Maker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
            - name: Install FFmpeg and Python dependencies
        run: |
          echo "Installing FFmpeg..."

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "Checking FFmpeg..."
          which ffmpeg
          ffmpeg -version | head -n 1

          echo "Installing Python dependencies..."
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pillow requests
      # ============================================================
      # 4. CLEAN OLD FRAMES
      # ============================================================
      - name: Clean old frames
        run: |
          echo "Cleaning old frames..."

          rm -f frame1.png
          rm -f frame2.png
          rm -f frame3.png
          rm -f frame4.png
          rm -f frame5.png
          rm -f frame6.png
          rm -f frame7.png
          rm -f frame8.png
          rm -f frame9.png
          rm -f frame10.png
          rm -f frame11.png
          rm -f frame12.png

          rm -rf frames

          mkdir -p frames

          echo "Workspace:"
          pwd
          ls -la

      # ============================================================
      # 5. RENDER
      # ============================================================
      - name: Render
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=========================================="
          echo "START RENDER"
          echo "=========================================="

          if [ ! -f render.py ]; then
            echo "ERROR: render.py not found"
            exit 1
          fi

          python render.py

          echo ""
          echo "=========================================="
          echo "FILES AFTER RENDER"
          echo "=========================================="

          find . -maxdepth 3 -type f \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            -print | sort

      # ============================================================
      # 6. NORMALIZE FRAME LOCATION
      # ============================================================
      - name: Normalize frames
        run: |
          echo "=========================================="
          echo "SEARCHING FOR GENERATED FRAMES"
          echo "=========================================="

          found=0

          for i in $(seq 1 12); do

            # Already in workspace root
            if [ -f "frame${i}.png" ]; then
              echo "Found root frame${i}.png"
              found=$((found + 1))
              continue
            fi

            # In ./frames/
            if [ -f "frames/frame${i}.png" ]; then
              echo "Found frames/frame${i}.png"
              cp "frames/frame${i}.png" "frame${i}.png"
              found=$((found + 1))
              continue
            fi

            # Search deeper in workspace
            result=$(find . -type f -name "frame${i}.png" \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -n "$result" ]; then
              echo "Found frame${i}.png at:"
              echo "$result"

              cp "$result" "frame${i}.png"

              found=$((found + 1))
            fi

          done

          echo ""
          echo "Normalized frames: $found / 12"

          echo ""
          echo "Root directory:"
          ls -lah

      # ============================================================
      # 7. VALIDATE EXACTLY 12 FRAMES
      # ============================================================
      - name: Validate exactly 12 frames
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING FRAME FILES"
          echo "=========================================="

          missing=0
          invalid=0

          for i in $(seq 1 12); do

            file="frame${i}.png"

            echo ""
            echo "Checking ${file} ..."

            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              missing=1
              continue
            fi

            size=$(stat -c%s "$file")

            echo "Size: ${size} bytes"

            if [ "$size" -le 100 ]; then
              echo "ERROR: $file is empty or too small"
              invalid=1
              continue
            fi

            file_type=$(file -b "$file")

            echo "Type: $file_type"

            if ! echo "$file_type" | grep -qi "PNG image data"; then
              echo "ERROR: $file is not a valid PNG"
              invalid=1
              continue
            fi

            echo "OK: $file"

          done

          echo ""
          echo "=========================================="
          echo "VALIDATION RESULT"
          echo "=========================================="

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: One or more frames are missing."
            exit 1
          fi

          if [ "$invalid" -ne 0 ]; then
            echo "ERROR: One or more frames are invalid."
            exit 1
          fi

          count=$(find . -maxdepth 1 -type f -name 'frame*.png' | wc -l)

          echo "Valid root PNG frames: $count"

          if [ "$count" -ne 12 ]; then
            echo "ERROR: Expected exactly 12 frame PNG files."
            exit 1
          fi

          echo ""
          echo "SUCCESS: Exactly 12 valid frames are ready."

      # ============================================================
      # 8. MAKE VIDEO
      # ============================================================
      - name: Make Video
        if: success()
        run: |
          set -e

          echo "=========================================="
          echo "MAKE VIDEO"
          echo "=========================================="

          echo "Checking FFmpeg..."
          ffmpeg -version | head -n 1

          echo ""
          echo "Input files:"

          for i in $(seq 1 12); do
            ls -lh "frame${i}.png"
          done

          echo ""
          echo "Creating video..."

          rm -f video.mp4

          ffmpeg \
            -y \
            -framerate 2 \
            -start_number 1 \
            -i "frame%d.png" \
            -frames:v 12 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            video.mp4

          echo ""
          echo "=========================================="
          echo "VIDEO CREATED"
          echo "=========================================="

          ls -lh video.mp4

          if [ ! -s video.mp4 ]; then
            echo "ERROR: video.mp4 was not created"
            exit 1
          fi

      # ============================================================
      # 9. UPLOAD VIDEO + FRAMES
      # ============================================================
      - name: Upload video and frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-result
          path: |
            video.mp4
            frame1.png
            frame2.png
            frame3.png
            frame4.png
            frame5.png
            frame6.png
            frame7.png
            frame8.png
            frame9.png
            frame10.png
            frame11.png
            frame12.png
          if-no-files-found: error
